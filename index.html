    <script>
        let SESSION = null;
        let DATABASE = { subjects:[], announcements:[], homework:[], students:[], logs:[], tracker:[] };

        // แปลงรหัสผ่านเป็น Hash (SHA-256) ก่อนส่ง เพื่อความปลอดภัยที่แน่นหนา
        async function hashPassword(str) {
            const msgBuffer = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('').toLowerCase();
        }

        // ฟังก์ชันกลางสำหรับติดต่อ API หลังบ้าน
        async function sendPostRequest(actionName, payload) {
            const data = { dataAction: actionName, username: SESSION ? SESSION.id : "Guest", payload: payload };
            try {
                const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
                return JSON.parse(await response.text());
            } catch (error) {
                return { success: false, message: "เชื่อมต่อฐานข้อมูลล้มเหลว ตรวจสอบอินเทอร์เน็ต" };
            }
        }

        // ระบบสลับแท็บ สร้างงาน <-> สร้างประกาศ
        function switchEditorTab(tab) {
            const btnHw = document.getElementById('tabBtnHomework');
            const btnAnn = document.getElementById('tabBtnAnnouncement');
            
            if(tab === 'homework') {
                document.getElementById('homeworkForm').classList.remove('hidden');
                document.getElementById('announcementForm').classList.add('hidden');
                
                btnHw.className = "text-xs font-bold px-4 py-2 rounded-lg bg-cyan-600 dark:bg-cyan-500 text-white dark:text-slate-950 shadow-md transition-all";
                btnAnn.className = "text-xs font-bold px-4 py-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900 transition-all";
            } else {
                document.getElementById('homeworkForm').classList.add('hidden');
                document.getElementById('announcementForm').classList.remove('hidden');
                
                btnHw.className = "text-xs font-bold px-4 py-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900 transition-all";
                btnAnn.className = "text-xs font-bold px-4 py-2 rounded-lg bg-amber-500 text-white shadow-md transition-all";
            }
        }

        // กดปุ่มล็อกอิน
        async function handleAuth(e) {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;
            const passHash = await hashPassword(pass);
            const btn = document.getElementById("loginBtn");
            
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังตรวจสอบ...`;
            btn.disabled = true;

            const res = await sendPostRequest("login", { username: user, passwordHash: passHash });
            
            btn.innerText = "เข้าสู่ระบบ";
            btn.disabled = false;

            if (res && res.success) { 
                SESSION = res.user; 
                setupDashboard(); 
            } else { 
                alert(res?.message || "รหัสผ่านหรือไอดีไม่ถูกต้อง"); 
            }
        }

        // จัดเตรียมหน้าจอหลังจากล็อกอินสำเร็จ (ซ่อน/แสดง เมนูตามสิทธิ์)
        function setupDashboard() {
            document.getElementById("loginPage").classList.add("hidden");
            document.getElementById("dashboardPage").classList.remove("hidden");
            document.getElementById("userFullName").innerText = SESSION.name;
            
            const badge = document.getElementById("badgeRole");
            badge.innerText = SESSION.role.toUpperCase();
            
            // สีป้ายบอกสถานะตาม Role
            if(SESSION.role === "admin") badge.className = "text-[9px] px-2 py-0.5 rounded-md font-extrabold bg-gradient-to-r from-rose-500 to-orange-500 text-white shadow-sm";
            else if(SESSION.role === "assistant") badge.className = "text-[9px] px-2 py-0.5 rounded-md font-extrabold bg-gradient-to-r from-emerald-500 to-teal-500 text-white shadow-sm";
            else badge.className = "text-[9px] px-2 py-0.5 rounded-md font-extrabold bg-slate-200 dark:bg-slate-800 text-cyan-700 dark:text-cyan-300";

            // ปลดล็อกแผงควบคุมตามสิทธิ์
            if(SESSION.role === "admin" || SESSION.role === "assistant") document.getElementById("editorPanel").classList.remove("hidden");
            if(SESSION.role === "admin") document.getElementById("adminPanel").classList.remove("hidden");

            refreshData();
        }

        // ดึงข้อมูล Real-time
        function refreshData() {
            fetch(`${API_URL}?action=syncData`)
            .then(res => res.json())
            .then(res => { if(res.success) { DATABASE = res.data; renderUI(); } })
            .catch(err => console.log("Sync Fail:", err));
        }

        // ยัดข้อมูลใส่ HTML
        function renderUI() {
            // 1. ช่องเลือกวิชา
            const subSelect = document.getElementById("hwSubject");
            subSelect.innerHTML = "";
            DATABASE.subjects.forEach(s => subSelect.innerHTML += `<option value="${s}">${s}</option>`);

            // 2. จัดการแผงแอดมิน (รายชื่อนร. สำหรับรีเซ็ตรหัส)
            if(SESSION.role === "admin") {
                const targetSelect = document.getElementById("adminTargetUser");
                targetSelect.innerHTML = "";
                DATABASE.students.forEach(st => targetSelect.innerHTML += `<option value="${st.id}">${st.id} - ${st.name}</option>`);
            }

            // 3. บอร์ดประกาศข่าวสาร
            const annBox = document.getElementById("announcementBox");
            annBox.innerHTML = "";
            
            if (DATABASE.announcements.length === 0) {
                annBox.innerHTML = `<p class="text-slate-400 text-center py-4 text-[10px]">ยังไม่มีประกาศใหม่ในขณะนี้</p>`;
            } else {
                DATABASE.announcements.forEach(a => {
                    let delBtn = "";
                    if(SESSION.role === "admin" || SESSION.role === "assistant") {
                        delBtn = `<button onclick="deleteAnnouncement('${a.NewsID}')" class="text-rose-500 hover:text-rose-700 text-[10px] p-1"><i class="fa-solid fa-trash-can"></i></button>`;
                    }
                    annBox.innerHTML += `
                        <div class="p-3 rounded-xl border-l-4 border-amber-500 bg-slate-100/60 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-900/50 space-y-1">
                            <div class="flex justify-between items-start gap-2">
                                <p class="font-bold text-amber-700 dark:text-amber-400 tracking-wide">${a.Title}</p>
                                ${delBtn}
                            </div>
                            <p class="text-slate-600 dark:text-slate-300 text-[11px] leading-relaxed">${a.Content}</p>
                        </div>`;
                });
            }

            // 4. ตารางงานและการเช็กสถานะ
            const tbody = document.getElementById("homeworkTableBody");
            tbody.innerHTML = "";
            let doneCount = 0;

            if(DATABASE.homework.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400 font-medium">🎉 ไม่มีงานคงค้างในระบบแล้ว! พักผ่อนได้เลย</td></tr>`;
                document.getElementById("statPercent").innerText = "100%";
                document.getElementById("statCount").innerText = "สำเร็จ 0/0 งาน";
            } else {
                DATABASE.homework.forEach(h => {
                    const isDone = DATABASE.tracker.some(t => t.StudentID.toString() === SESSION.id.toString() && t.HomeworkID === h.HomeworkID);
                    if(isDone) doneCount++;

                    const checkColor = isDone ? 'text-emerald-500' : 'text-slate-300 dark:text-slate-700 hover:text-cyan-500';
                    const checkIcon = isDone ? 'fa-solid fa-circle-check' : 'fa-regular fa-circle';
                    const statusBtn = `<button onclick="toggleTaskStatus('${h.HomeworkID}', '${isDone ? 'pending' : 'done'}')" class="hover:scale-110 active:scale-95 transition-all text-base ${checkColor}"><i class="${checkIcon}"></i></button>`;
                    
                    const urlHtml = h.URL ? `<a href="${h.URL}" target="_blank" class="text-cyan-600 dark:text-cyan-400 hover:underline inline-flex items-center gap-1 bg-cyan-500/10 px-2 py-0.5 rounded-md text-[10px] font-medium"><i class="fa-solid fa-link text-[8px]"></i> ลิงก์แนบ</a>` : '<span class="text-slate-400 dark:text-slate-600 text-[10px]">—</span>';
                    const notesHtml = h.Notes ? `<p class="text-amber-600 dark:text-amber-500/80 text-[10px] mt-1 font-light bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/20 inline-block">${h.Notes}</p>` : '';

                    let actionBtn = `<span class="text-slate-300 dark:text-slate-700">—</span>`;
                    if(SESSION.role === "admin" || SESSION.role === "assistant") {
                        actionBtn = `<button onclick="deleteHomework('${h.HomeworkID}')" class="bg-rose-500/10 text-rose-600 dark:text-rose-400 hover:bg-rose-600 hover:text-white px-2 py-1 rounded-lg border border-rose-500/20 text-[10px] font-bold transition-all"><i class="fa-solid fa-trash-can"></i> ลบ</button>`;
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-100/50 dark:hover:bg-slate-900/30 text-slate-700 dark:text-slate-200 border-b border-slate-200 dark:border-slate-900/40 transition-all">
                            <td class="py-3 px-2 text-center">${statusBtn}</td>
                            <td class="py-3 px-3 font-bold text-cyan-700 dark:text-cyan-400 tracking-wide">${h.Subject}</td>
                            <td class="py-3 px-3 font-medium text-slate-900 dark:text-slate-200 text-sm">${h.Title}</td>
                            <td class="py-3 px-3 text-rose-600 dark:text-rose-400 font-mono font-medium">${h.Deadline}</td>
                            <td class="py-3 px-3">${urlHtml} <br> ${notesHtml}</td>
                            <td class="py-3 px-2 text-center">${actionBtn}</td>
                        </tr>`;
                });

                // คำนวณเปอร์เซ็นต์
                const percent = Math.round((doneCount / DATABASE.homework.length) * 100);
                document.getElementById("statPercent").innerText = percent + "%";
                document.getElementById("statCount").innerText = `สำเร็จ ${doneCount}/${DATABASE.homework.length} ภารกิจ`;
            }

            // 5. อัปเดต Logs ให้แอดมินดู
            if(SESSION.role === "admin") {
                const logCont = document.getElementById("logContainer");
                logCont.innerHTML = "";
                DATABASE.logs.forEach(l => {
                    logCont.innerHTML += `<div><span class="text-teal-500">[${l.Timestamp.substring(11,19)}]</span> <span class="text-amber-400 font-medium">${l.User}</span> : <span class="text-slate-300">${l.Action}</span></div>`;
                });
            }
        }

        // ==================== CRUD FUNCTIONS ====================

        async function submitAnnouncement() {
            const title = document.getElementById("annTitle").value.trim();
            const content = document.getElementById("annContent").value.trim();
            if(!title || !content) return alert("โปรดระบุข้อมูลให้ครบถ้วน");

            const res = await sendPostRequest("addAnnouncement", { title, content });
            if(res.success) {
                alert("โพสต์ประกาศขึ้นบอร์ดสำเร็จ!");
                document.getElementById("annTitle").value = "";
                document.getElementById("annContent").value = "";
                refreshData();
            }
        }

        async function deleteAnnouncement(annId) {
            if(!confirm("ต้องการลบประกาศนี้ใช่หรือไม่?")) return;
            const res = await sendPostRequest("deleteAnnouncement", { annId });
            if(res.success) refreshData();
        }

        async function toggleTaskStatus(hwId, nextStatus) {
            const res = await sendPostRequest("toggleTask", { hwId: hwId, status: nextStatus });
            if(res.success) refreshData();
        }

        async function submitHomework() {
            const subject = document.getElementById("hwSubject").value;
            const title = document.getElementById("hwTitle").value.trim();
            const deadline = document.getElementById("hwDeadline").value;
            const url = document.getElementById("hwUrl").value.trim();
            const notes = document.getElementById("hwNotes").value.trim();

            if(!title || !deadline) return alert("โปรดระบุ หัวข้อ และ กำหนดส่ง ให้เรียบร้อย");
            
            const res = await sendPostRequest("addHomework", { subject, title, deadline, url, notes, createdBy: SESSION.id });
            if(res.success) {
                alert("บันทึกภาระงานใหม่สำเร็จ!");
                document.getElementById("hwTitle").value = "";
                document.getElementById("hwUrl").value = "";
                document.getElementById("hwNotes").value = "";
                refreshData();
            }
        }

        async function deleteHomework(hwId) {
            if(!confirm("ยืนยันการลบภารกิจการบ้านนี้? (การลบจะลบข้อมูลการเช็กของเพื่อนทุกคนด้วย)")) return;
            const res = await sendPostRequest("deleteHomework", { hwId });
            if(res.success) refreshData();
        }

        async function updateProfile() {
            const newName = document.getElementById("profileName").value.trim();
            const newPass = document.getElementById("profilePass").value;
            
            if(!newName && !newPass) return alert("กรุณาระบุข้อมูลที่ต้องการแก้ไข");
            
            let payload = { username: SESSION.id };
            if(newName) payload.newName = newName;
            if(newPass) payload.newPasswordHash = await hashPassword(newPass);

            const res = await sendPostRequest("updateProfile", payload);
            if(res.success) {
                alert("บันทึกข้อมูลส่วนตัวเรียบร้อย");
                if(newName) SESSION.name = newName;
                document.getElementById("profileName").value = "";
                document.getElementById("profilePass").value = "";
                refreshData();
            }
        }

        async function adminResetPassword() {
            const target = document.getElementById("adminTargetUser").value;
            const newPass = document.getElementById("adminNewPass").value;
            if(!newPass) return alert("โปรดระบุรหัสผ่านใหม่");
            const hash = await hashPassword(newPass);

            const res = await sendPostRequest("adminAction", { subAction: "resetPassword", targetUser: target, newPasswordHash: hash });
            if(res.success) { 
                alert("เปลี่ยนรหัสผ่านให้เพื่อนสำเร็จ!"); 
                document.getElementById("adminNewPass").value = ""; 
                refreshData(); 
            }
        }

        async function adminChangeRole() {
            const target = document.getElementById("adminTargetUser").value;
            const newRole = document.getElementById("adminNewRole").value;
            const res = await sendPostRequest("adminAction", { subAction: "changeRole", targetUser: target, newRole: newRole });
            if(res.success) { alert("ปรับระดับบทบาทผู้ใช้งานสำเร็จ"); refreshData(); }
        }

        async function triggerForgotPassword() {
            const user = prompt("โปรดระบุเลขประจำตัวของคุณ เพื่อส่งสัญญาณแจ้งเตือนไปยังแอดมินกลาง:");
            if(!user) return;
            const data = { dataAction: "adminAction", username: user.trim(), payload: { subAction: "forgotNotify", targetUser: user.trim() } };
            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
                alert("🚀 ยิงสัญญาณฉุกเฉินสำเร็จ! โปรดรอให้แอดมินดำเนินการ");
            } catch(e) { alert("เครือข่ายขัดข้อง"); }
        }

        function toggleThemeMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function logout() {
            SESSION = null;
            document.getElementById("loginPage").classList.remove("hidden");
            document.getElementById("dashboardPage").classList.add("hidden");
            
            // ล้างฟอร์มตอนออก
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }
    </script>
</body>
</html>
