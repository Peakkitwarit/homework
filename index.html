<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ M.6/4 SMART HUB v27.4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sarabun:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f6ff; --card:rgba(255,255,255,0.85); --accent:#5b5ef4; --text:#18163a; --success:#10b981; --danger:#f43f5e; }
    .dark { --bg:#050d17; --card:rgba(6, 18, 32, 0.94); --accent:#00ff9d; --text:#c4f0e0; }
    body { background-color:var(--bg); color:var(--text); font-family:'Sarabun',sans-serif; transition: 0.3s; overflow-x: hidden; }
    .glass { background:var(--card); backdrop-filter:blur(20px); border:1px solid rgba(128,128,128,0.1); box-shadow:0 8px 32px rgba(0,0,0,0.05); }
    .mono { font-family:'JetBrains Mono',monospace; }
    .tab-active { color:var(--accent)!important; font-weight:800; border-bottom:3px solid var(--accent); }
    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px); transition:0.4s; z-index:9999; }
    #toast.show { transform:translateX(-50%) translateY(0); }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
    html.dark body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:9998; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px); animation: scanline 10s linear infinite; }
    @keyframes scanline { 0% {background-position:0 0} 100% {background-position:0 100%} }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<div id="maintenanceScreen" class="hidden fixed inset-0 z-[10000] bg-[#020617] flex flex-col items-center justify-center p-6 text-center">
  <div class="w-20 h-20 border-4 border-[#00ff9d] border-t-transparent rounded-full animate-spin mb-8 shadow-[0_0_15px_#00ff9d]"></div>
  <h1 class="text-2xl font-black mono text-[#00ff9d] animate-pulse">SERVER_UPDATING...</h1>
  <div class="glass p-6 rounded-[2rem] border border-[#00ff9d]/20 w-full max-w-xs mt-8">
    <div class="w-full h-1.5 bg-[#00ff9d]/10 rounded-full overflow-hidden">
      <div id="updateBar" class="h-full bg-[#00ff9d] transition-all duration-700 shadow-[0_0_10px_#00ff9d]" style="width: 0%"></div>
    </div>
    <p id="updatePercent" class="text-[10px] mono text-[#00ff9d] mt-2">0%</p>
  </div>
  <button onclick="bypassMT()" class="mt-20 opacity-0 text-[8px] mono text-white">ADMIN_BYPASS</button>
</div>

<div id="processing" class="hidden fixed inset-0 z-[9999] bg-black/20 backdrop-blur-[2px] flex items-center justify-center">
  <div class="glass p-8 rounded-[2rem] flex flex-col items-center gap-3">
    <div class="w-10 h-10 border-4 border-accent border-t-transparent rounded-full animate-spin"></div>
    <p class="text-[10px] font-bold mono animate-pulse">SYNCING...</p>
  </div>
</div>

<div id="toast" class="glass px-8 py-4 rounded-2xl text-xs font-bold shadow-2xl border border-white/10">⚡ <span id="toastMsg">Success</span></div>

<nav class="sticky top-0 z-50 glass border-b border-white/5 px-6 py-4 flex justify-between items-center">
  <div class="flex items-center gap-4">
    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold">6/4</div>
    <div>
      <h1 class="text-sm font-bold tracking-tight mono uppercase">Smart Hub <span class="text-accent">v27.4</span></h1>
      <p id="userDisplayName" class="text-[9px] mono opacity-50 uppercase tracking-widest italic">Guest_Node</p>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <button onclick="toggleDarkMode()" id="themeBtn" class="w-10 h-10 rounded-xl glass flex items-center justify-center">🌙</button>
    <button onclick="handleLogout()" class="px-4 py-2 border border-red-500/30 text-red-500 rounded-xl text-[10px] font-bold uppercase">Exit</button>
  </div>
</nav>

<div id="loginSection" class="flex-1 flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_rgba(91,94,244,0.05),_transparent)]">
  <div class="glass p-10 rounded-[3.5rem] w-full max-w-sm shadow-2xl fade-in text-center">
    <div class="w-16 h-16 bg-accent/10 text-accent rounded-3xl flex items-center justify-center text-3xl mx-auto mb-8">🔐</div>
    <h2 class="text-2xl font-black mono tracking-tighter mb-8 uppercase">Authenticate</h2>
    <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
      <input type="text" id="login-u" placeholder="เลขที่ หรือ admin" required class="w-full p-4 rounded-2xl glass border border-white/5 focus:border-accent outline-none text-sm mono transition-all">
      <input type="password" id="login-p" placeholder="Password (เริ่มต้น 1234)" required class="w-full p-4 rounded-2xl glass border border-white/5 focus:border-accent outline-none text-sm mono transition-all">
      <button type="submit" id="loginBtn" class="w-full py-4 bg-accent text-white rounded-2xl text-xs font-bold tracking-widest shadow-xl shadow-accent/20 uppercase mt-4 hover:opacity-90 transition-all">Login_Secure</button>
    </form>
    <button onclick="alert('🔑 ลืมรหัสผ่าน? กรุณาแจ้ง Admin เพื่อ Reset เป็น 1234')" class="mt-6 text-[10px] mono opacity-30 hover:opacity-100 transition-all">[ Forgot_Key? ]</button>
    <p id="loginError" class="text-xs text-red-500 mt-4 hidden font-black"></p>
  </div>
</div>

<div id="mainSection" class="hidden flex-1 flex flex-col">
  <div class="max-w-7xl mx-auto w-full px-6 flex gap-8 border-b border-white/5 overflow-x-auto no-scrollbar">
    <button onclick="switchTab('homeworkTab')" id="btn-homeworkTab" class="py-5 text-xs font-bold mono tab-active tracking-widest">DASHBOARD</button>
    <button onclick="switchTab('statsTab')" id="btn-statsTab" class="py-5 text-xs font-bold mono opacity-40 tracking-widest">ANALYTICS</button>
    <button onclick="switchTab('adminTab')" id="btn-adminTab" class="hidden py-5 text-xs font-bold mono text-red-500 opacity-40 tracking-widest">ROOT_CMD</button>
  </div>

  <main class="max-w-7xl w-full mx-auto px-6 py-8 space-y-8 pb-24">
    <div id="homeworkTab" class="fade-in space-y-8">
      <div id="assistantTools" class="hidden glass p-6 rounded-[2.5rem] border-l-4 border-accent space-y-5 bg-gradient-to-r from-accent/5 to-transparent">
        <p class="text-[10px] font-bold mono text-accent uppercase tracking-widest">// Assistant_Manager</p>
        <div class="flex flex-wrap gap-3">
          <button onclick="openAddHwModal()" class="px-6 py-3 bg-accent text-white rounded-xl text-[10px] font-bold">+ NEW_TASK</button>
          <button onclick="syncSubjects()" class="px-6 py-3 border border-accent text-accent rounded-xl text-[10px] font-bold">🔄 SYNC_TIMETABLE</button>
          <button onclick="exportCSV()" class="px-6 py-3 glass border border-white/10 rounded-xl text-[10px] font-bold">📥 EXPORT</button>
        </div>
      </div>
      <div id="homeworkContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <div id="statsTab" class="hidden fade-in text-center">
      <div class="glass p-10 rounded-[3rem] h-[400px] flex flex-col items-center">
        <p class="text-xs font-bold mono opacity-40 mb-6 tracking-widest uppercase">// Mission_Success_Rate</p>
        <div class="relative flex-1 w-full"><canvas id="statChart"></canvas></div>
      </div>
    </div>

    <div id="adminTab" class="hidden fade-in space-y-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass p-8 rounded-[3.5rem] border border-red-500/20 space-y-6">
          <p class="text-[10px] font-bold mono text-red-500 uppercase tracking-widest">// Password_Override</p>
          <div class="flex gap-2">
            <input type="text" id="reset-id" placeholder="Student ID" class="flex-1 p-4 rounded-2xl glass text-xs mono outline-none">
            <button onclick="handleResetPW()" class="px-6 py-4 bg-red-500 text-white rounded-2xl font-bold text-xs">RESET</button>
          </div>
          <div class="w-full h-px bg-white/5 my-4"></div>
          <p class="text-[10px] font-bold mono text-accent uppercase tracking-widest">// Server_Status</p>
          <button id="mt-btn" onclick="toggleMT()" class="w-full py-4 border border-accent text-accent rounded-2xl text-xs font-bold hover:bg-accent hover:text-black">ENABLE_MAINTENANCE</button>
        </div>
        <div class="glass p-8 rounded-[3.5rem] flex flex-col overflow-hidden">
          <p class="text-[10px] font-bold mono text-accent uppercase mb-4 tracking-widest">// Activity_Logs</p>
          <div id="logList" class="flex-1 text-[10px] mono space-y-3 overflow-y-auto no-scrollbar pr-2"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="addHwModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md z-[1000] flex items-center justify-center p-6">
  <div class="glass p-10 rounded-[3.5rem] w-full max-w-md shadow-2xl border border-white/10">
    <h3 class="font-black mb-8 text-xl mono tracking-tighter uppercase">Assign_Mission</h3>
    <div class="space-y-4">
      <select id="hw-subject" class="w-full p-4 rounded-2xl glass text-sm outline-none border border-white/5"></select>
      <input type="text" id="hw-task" placeholder="รายละเอียดภารกิจ..." class="w-full p-4 rounded-2xl glass text-sm outline-none">
      <input type="date" id="hw-date" class="w-full p-4 rounded-2xl glass text-sm mono outline-none">
      <div class="flex gap-3 pt-6">
        <button onclick="closeAddHwModal()" class="flex-1 py-4 glass rounded-2xl font-bold text-xs uppercase">Cancel</button>
        <button onclick="submitHomework()" class="flex-1 py-4 bg-accent text-white rounded-2xl font-bold text-xs uppercase shadow-lg">Commit</button>
      </div>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyBXf4KI5YSeMuE7LCf0yHjbOp8CEiOgyzTStFmfGLPJa43NUvgq-finl3lp-5dslhX/exec"; 
const API_KEY = "M64_SUPER_SECRET_2026";
let currentUser="", currentRole="", homeworks=[], chart=null, isMT=false;

window.onload = checkMT;

async function apiCall(data) {
  document.getElementById('processing').classList.remove('hidden');
  try {
    const res = await fetch(WEB_APP_URL, { method:'POST', body:JSON.stringify({ ...data, apiKey:API_KEY, role:currentRole, username:currentUser }) });
    const result = await res.json();
    return result;
  } catch(e) {
    showToast("เซิร์ฟเวอร์ขัดข้อง", "var(--danger)");
    return { success:false };
  } finally {
    document.getElementById('processing').classList.add('hidden');
  }
}

async function checkMT() {
  const res = await apiCall({ action:'getSystemStatus' });
  if (res.success) {
    isMT = res.maintenance;
    if (isMT) {
      document.getElementById('maintenanceScreen').classList.remove('hidden');
      let p=0; const itv = setInterval(() => { p+=Math.floor(Math.random()*5); if(p>99) p=99; document.getElementById('updatePercent').innerText=p+'%'; document.getElementById('updateBar').style.width=p+'%'; }, 800);
    }
  }
}

async function handleLogin(e) {
  if(e) e.preventDefault();
  const u = document.getElementById('login-u').value.trim();
  const p = document.getElementById('login-p').value.trim();
  if(!u || !p) return showToast("กรุณากรอกข้อมูล", "var(--danger)");

  const res = await apiCall({ action:'login', username:u, password:p });
  if (res.success) {
    currentUser=u; currentRole=res.role;
    if (res.isFirstTime) {
      const np = prompt("SECURITY: กรุณาตั้งรหัสผ่านใหม่ (8 ตัวขึ้นไป):");
      if (np && np.length >= 8) {
        const setRes = await apiCall({ action:'setFirstPassword', username:u, newPassword:np });
        if(!setRes.success) { alert("เปลี่ยนรหัสผ่านไม่สำเร็จ!"); return; }
      }
      else { alert("ต้องเปลี่ยนรหัสก่อน!"); return; }
    }
    loginSuccess();
  } else {
    showToast(res.message, "var(--danger)");
  }
}

function loginSuccess() {
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('mainSection').classList.remove('hidden');
  document.getElementById('userDisplayName').innerText = `USER_${currentUser} | ROLE_${currentRole.toUpperCase()}`;
  if (currentRole === 'admin') {
    document.getElementById('btn-adminTab').classList.remove('hidden');
    document.getElementById('mt-btn').innerText = isMT ? "DISABLE_MAINTENANCE" : "ENABLE_MAINTENANCE";
  }
  if (currentRole === 'admin' || currentRole === 'assistant') document.getElementById('assistantTools').classList.remove('hidden');
  loadHomework(); loadSubjects();
  showToast("เข้าระบบสำเร็จ", "var(--success)");
}

async function loadHomework() {
  const res = await apiCall({ action:'getHomework' });
  if (res.success) {
    homeworks = res.data;
    const cont = document.getElementById('homeworkContainer');
    const manage = (currentRole === 'admin' || currentRole === 'assistant');
    cont.innerHTML = homeworks.map(h => {
      const isD = h.status === 'done';
      return `
        <div class="glass p-7 rounded-[3rem] fade-in flex flex-col justify-between border-l-4 ${isD?'opacity-40 border-success':'border-accent shadow-lg'}">
          <div>
            <div class="flex justify-between items-start mb-5">
              <span class="text-[9px] font-bold mono bg-accent/10 text-accent px-2.5 py-1 rounded-lg uppercase">${h.subject}</span>
              ${manage ? `<button onclick="deleteHW('${h.id}')" class="text-red-500 font-bold text-xs hover:scale-125 transition-all">🗑</button>`:''}
            </div>
            <p class="font-bold text-sm leading-relaxed mb-2">${h.task}</p>
          </div>
          <div class="mt-4 pt-4 border-t border-white/5 flex justify-between items-center">
            <span class="text-[9px] mono opacity-40">${h.dueDate||'NO_DATE'}</span>
            <button onclick="toggleHW('${h.id}','${h.status}')" class="px-6 py-2.5 rounded-xl text-[9px] font-black ${isD?'glass':'bg-accent text-white shadow-lg'} transition-all">${isD?'REVERT':'DONE'}</button>
          </div>
        </div>`;
    }).join('');
  }
}

async function toggleHW(id, cur) {
  const next = cur === 'done' ? 'pending' : 'done';
  const res = await apiCall({ action:'updateStatus', id, status:next });
  if (res.success) { if(next==='done') confetti({ particleCount:150, spread:70, origin:{y:0.7} }); loadHomework(); }
}

async function syncSubjects() {
  if (confirm("Sync รายวิชาตามตารางเรียน (16 วิชาหลัก)?")) { await apiCall({ action:'syncSubjects' }); loadSubjects(); showToast("ซิงค์วิชาเรียบร้อย"); }
}

async function handleResetPW() {
  const id = document.getElementById('reset-id').value.trim();
  if(!id) return;
  const res = await apiCall({ action:'adminResetPassword', targetUsername:id });
  if (res.success) { showToast(`รีเซ็ต ${id} เป็น 1234 แล้ว`); document.getElementById('reset-id').value=''; loadLogs(); }
}

async function toggleMT() {
  const next = !isMT;
  const res = await apiCall({ action:'toggleMaintenance', status:next });
  if (res.success) { isMT=next; location.reload(); }
}

async function loadLogs() {
  const res = await apiCall({ action:'getUsageLogs' });
  if (res.success) {
    document.getElementById('logList').innerHTML = res.data.map(l => `
      <div class="pb-2 border-b border-white/5 flex justify-between items-center">
        <div class="flex flex-col"><span class="text-accent font-bold uppercase">${l[1]}</span><span class="opacity-60 text-[9px]">${l[2]}: ${l[3]}</span></div>
        <span class="opacity-20 text-[8px] mono">${new Date(l[0]).toLocaleTimeString()}</span>
      </div>`).join('');
  }
}

function switchTab(id) {
  ['homeworkTab','statsTab','adminTab'].forEach(t => document.getElementById(t).classList.add('hidden'));
  ['btn-homeworkTab','btn-statsTab','btn-adminTab'].forEach(b => document.getElementById(b).classList.remove('tab-active', 'opacity-100'));
  document.getElementById(id).classList.remove('hidden');
  document.getElementById('btn-'+id).classList.add('tab-active', 'opacity-100');
  if (id === 'adminTab') loadLogs();
  if (id === 'statsTab') setTimeout(renderChart, 200);
}

function showToast(m, c) { const t=document.getElementById('toast'); document.getElementById('toastMsg').innerText=m; if(c) t.style.borderColor=c; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); }
function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }
function bypassMT() { if(prompt("ADMIN_KEY:")==="M64") document.getElementById('maintenanceScreen').classList.add('hidden'); }
function openAddHwModal() { document.getElementById('addHwModal').classList.remove('hidden'); }
function closeAddHwModal() { document.getElementById('addHwModal').classList.add('hidden'); }
function handleLogout() { location.reload(); }
async function loadSubjects() { const res = await apiCall({ action:'getSubjects' }); if (res.success) document.getElementById('hw-subject').innerHTML = res.data.map(s=>`<option value="${s}">${s}</option>`).join(''); }
async function submitHomework() { await apiCall({ action:'addHomework', subject:document.getElementById('hw-subject').value, task:document.getElementById('hw-task').value, dueDate:document.getElementById('hw-date').value }); closeAddHwModal(); loadHomework(); }
async function deleteHW(id) { if(confirm("ลบงานนี้?")) { await apiCall({ action:'adminDeleteHomework', id }); loadHomework(); } }

function renderChart() {
  const done = homeworks.filter(h=>h.status==='done').length;
  const pending = homeworks.length - done;
  const ctx = document.getElementById('statChart').getContext('2d');
  const isDark = document.documentElement.classList.contains('dark');
  if (chart) chart.destroy();
  chart = new Chart(ctx, { type:'doughnut', data:{ labels:['DONE','PENDING'], datasets:[{ data:[done,pending], backgroundColor:[isDark?'#00ff9d':'#10b981','#5b5ef4'], borderWidth:0 }] }, options:{ maintainAspectRatio:false, cutout:'85%', plugins:{ legend:{ labels:{ color:isDark?'#c4f0e0':'#18163a', font:{ family:'JetBrains Mono', size:10 } } } } } });
}

function exportCSV() {
  const csv = "ID,Subject,Task,Deadline,Status\n" + homeworks.map(h => `${h.id},${h.subject},${h.task},${h.dueDate},${h.status}`).join("\n");
  const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv); a.download = 'M64_HUB_DATA.csv'; a.click();
}
</script>
</body>
</html>
