<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ม.6/4 Homework HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        // เปิดใช้งานระบบสลับโหมดของ Tailwind
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Kanit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .glass-panel {
            @apply bg-white/80 dark:bg-slate-900/65 backdrop-blur-xl border border-slate-200 dark:border-slate-800/80 shadow-sm dark:shadow-2xl;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-300 dark:bg-slate-800 rounded-full; }
        ::-webkit-scrollbar-thumb:hover { @apply bg-slate-400 dark:bg-slate-700; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#090d16] text-slate-800 dark:text-slate-100 min-h-screen selection:bg-cyan-500/20 selection:text-cyan-800 dark:selection:text-cyan-200">

    <script>
        // ⚠️ ลิงก์ API สู่ Google Apps Script ของคุณ
        const API_URL = "https://script.google.com/macros/s/AKfycbxbhnKdXeXCe0mfnaeRCYkcgXg1fiFJt9o7cLFvijkbu_GypWetnB4Z1IApaAgAU4xtTw/exec"; 
        
        // ตรวจสอบโหมดเริ่มต้นจากเครื่องผู้ใช้
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>

    <div id="loginPage" class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden bg-gradient-to-br from-slate-50 via-slate-100 to-zinc-200 dark:from-[#090d16] dark:via-[#0f172a] dark:to-slate-950">
        <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-cyan-500/5 dark:bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-teal-500/5 dark:bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="glass-panel p-8 rounded-2xl w-full max-w-md relative z-10 transition-all duration-300 hover:border-slate-300 dark:hover:border-slate-700/50">
            <div class="text-center mb-8">
                <div class="inline-flex p-3.5 bg-cyan-500/10 rounded-xl mb-4 text-cyan-600 dark:text-cyan-400 border border-cyan-500/20 shadow-inner">
                    <i class="fa-solid fa-layer-group text-3xl animate-pulse"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                    HOMEWORK HUB <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-cyan-500/10 dark:bg-cyan-500/20 text-cyan-600 dark:text-cyan-300 ml-1 border border-cyan-500/30">ม.6/4</span>
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-xs mt-2 font-light tracking-wide">ระบบบริหารจัดการภาระงานและสารสนเทศกลาง</p>
            </div>
            
            <form onsubmit="handleAuth(event)" class="space-y-5">
                <div>
                    <label class="block text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase mb-1.5">เลขประจำตัวนักเรียน / ผู้ดูแล</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 dark:text-slate-500 text-xs"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="username" required class="w-full bg-slate-100/60 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-slate-900 dark:text-white text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/30 focus:outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="ระบุเลขประจำตัว เช่น 34119">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase mb-1.5">รหัสผ่านบัญชี</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 dark:text-slate-500 text-xs"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" required class="w-full bg-slate-100/60 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-slate-900 dark:text-white text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/30 focus:outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 text-white dark:text-slate-950 font-bold py-3 rounded-xl text-sm hover:opacity-95 shadow-lg shadow-cyan-500/10 active:scale-[0.99] transition-all duration-150 mt-2">
                    เข้าสู่ระบบรักษาความปลอดภัย
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <button onclick="triggerForgotPassword()" class="text-xs text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 underline decoration-slate-300 dark:decoration-slate-700 transition-all">
                    ลืมรหัสผ่าน? ส่งสัญญาณแจ้งแอดมินกลาง
                </button>
            </div>
        </div>
    </div>

    <div id="dashboardPage" class="hidden min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200">
        <header class="glass-panel border-b border-slate-200 dark:border-slate-900 px-6 py-4 flex justify-between items-center sticky top-0 z-40 backdrop-blur-md shadow-sm">
            <div class="flex items-center gap-3">
                <span class="text-base font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 via-teal-600 to-emerald-600 dark:from-cyan-400 dark:via-teal-400 dark:to-emerald-400">⚡ ROOM 6/4 CENTER</span>
                <span id="badgeRole" class="text-[9px] px-2 py-0.5 rounded-md font-extrabold tracking-widest uppercase"></span>
            </div>
            <div class="flex items-center gap-3.5">
                <button onclick="toggleThemeMode()" class="bg-white dark:bg-slate-900/60 hover:bg-slate-100 dark:hover:bg-slate-800/80 border border-slate-200 dark:border-slate-800/60 text-slate-600 dark:text-slate-400 hover:text-amber-500 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 transition-all shadow-sm">
                    <i class="fa-solid fa-circle-half-stroke text-[11px]"></i> สลับโหมด UI
                </button>
                <div class="text-right hidden sm:block border-l border-slate-200 dark:border-slate-800 pl-3.5">
                    <p id="userFullName" class="text-xs font-semibold text-slate-700 dark:text-slate-300"></p>
                </div>
                <button onclick="logout()" class="bg-rose-500/10 hover:bg-rose-600 border border-rose-500/20 text-rose-600 dark:text-rose-400 hover:text-white p-2 rounded-xl text-xs transition-all" title="ออกจากระบบ">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 p-4 sm:p-6 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <div class="space-y-6 lg:col-span-1">
                <div class="glass-panel p-5 rounded-2xl relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 text-slate-200 dark:text-slate-800/20 text-7xl font-bold"><i class="fa-solid fa-chart-pie"></i></div>
                    <h3 class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3.5"><i class="fa-solid fa-chart-line text-cyan-500 mr-2"></i> ความคืบหน้างานของคุณ</h3>
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-4xl font-black text-slate-900 dark:text-white tracking-tight" id="statPercent">0%</p>
                            <p class="text-[11px] font-medium text-emerald-600 dark:text-emerald-400 mt-1" id="statCount">สำเร็จ 0/0 งาน</p>
                        </div>
                        <div class="h-12 w-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-600 dark:text-emerald-400">
                            <i class="fa-solid fa-square-check text-xl"></i>
                        </div>
                    </div>
                </div>

                <div class="glass-panel p-5 rounded-2xl">
                    <h3 class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3.5"><i class="fa-solid fa-bullhorn text-amber-500 mr-2"></i> บอร์ดประกาศข่าวสาร</h3>
                    <div id="announcementBox" class="space-y-3 max-h-64 overflow-y-auto pr-1 text-xs">
                        </div>
                </div>

                <div class="glass-panel p-5 rounded-2xl">
                    <h3 class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3.5"><i class="fa-solid fa-user-gear text-purple-500 mr-2"></i> ความปลอดภัยและโปรไฟล์</h3>
                    <div class="space-y-3 text-xs">
                        <div>
                            <input type="text" id="profileName" placeholder="แก้ไขชื่อ - นามสกุล" class="w-full bg-slate-100/50 dark:bg-slate-950/80 p-2.5 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:border-purple-500 focus:outline-none transition-all">
                        </div>
                        <div>
                            <input type="password" id="profilePass" placeholder="ตั้งรหัสผ่านความปลอดภัยใหม่" class="w-full bg-slate-100/50 dark:bg-slate-950/80 p-2.5 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:border-purple-500 focus:outline-none transition-all">
                        </div>
                        <button onclick="updateProfile()" class="w-full bg-purple-500/10 hover:bg-purple-600 border border-purple-500/20 text-purple-600 dark:text-purple-300 hover:text-white font-bold py-2.5 rounded-xl transition-all">
                            อัปเดตข้อมูลส่วนตัว
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                
                <div id="editorPanel" class="hidden glass-panel border border-emerald-500/20 p-5 rounded-2xl shadow-xl space-y-4">
                    <div class="flex gap-2 border-b border-slate-200 dark:border-slate-800 pb-2">
                        <button onclick="switchEditorTab('homework')" id="tabBtnHomework" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-cyan-600 dark:bg-cyan-500 text-white dark:text-slate-950 transition-all shadow-sm">
                            <i class="fa-solid fa-tasks mr-1"></i> จัดการเพิ่มการบ้าน
                        </button>
                        <button onclick="switchEditorTab('announcement')" id="tabBtnAnnouncement" class="text-xs font-bold px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900 transition-all">
                            <i class="fa-solid fa-bullhorn mr-1"></i> จัดการเพิ่มประกาศกลุ่ม
                        </button>
                    </div>

                    <div id="homeworkForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                            <select id="hwSubject" class="bg-slate-100/80 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-2.5 text-slate-800 dark:text-slate-200 focus:border-emerald-500 focus:outline-none"></select>
                            <input type="text" id="hwTitle" placeholder="ชื่อหัวข้อภารกิจ/งาน" class="bg-slate-100/80 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-2.5 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:border-emerald-500 focus:outline-none">
                            <input type="date" id="hwDeadline" class="bg-slate-100/80 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-2.5 text-slate-900 dark:text-white focus:border-emerald-500 focus:outline-none">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                            <input type="url" id="hwUrl" placeholder="ลิงก์สั่งงานปลายทาง URL (ถ้ามี)" class="bg-slate-100/80 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-2.5 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:border-emerald-500 focus:outline-none">
                            <input type="text" id="hwNotes" placeholder="คำอธิบาย / หมายเหตุงานเพิ่มเติม" class="bg-slate-100/80 dark:
