<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ M.6/4 SMART HUB v27.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sarabun:wght@300;400;600;700&family=Mitr:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: { 'scanline': 'scanline 8s linear infinite', 'glow': 'glow 2s ease-in-out infinite', 'slide-up': 'slideUp 0.4s ease-out' },
          keyframes: {
            scanline: { '0%': { backgroundPosition: '0 0' }, '100%': { backgroundPosition: '0 100%' } },
            glow: { '0%, 100%': { boxShadow: '0 0 5px var(--accent)' }, '50%': { boxShadow: '0 0 20px var(--accent)' } },
            slideUp: { 'from': { opacity: 0, transform: 'translateY(20px)' }, 'to': { opacity: 1, transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: #f4f6ff; --card: rgba(255, 255, 255, 0.85); --accent: #5b5ef4; --text: #18163a; --success: #10b981; --danger: #f43f5e;
    }
    .dark {
      --bg: #050d17; --card: rgba(6, 18, 32, 0.94); --accent: #00ff9d; --text: #c4f0e0;
    }
    body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow-x: hidden; }
    .display { font-family: 'Space Grotesk', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .thai-display { font-family: 'Mitr', sans-serif; }
    .glass { background: var(--card); backdrop-filter: blur(20px); border: 1px solid rgba(128,128,128,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
    html.dark body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9998; animation: scanline 10s linear infinite;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 157, 0.02) 2px, rgba(0, 255, 157, 0.02) 4px);
    }
    .tab-active { color: var(--accent) !important; font-weight: 800; border-bottom: 3px solid var(--accent); }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); transition: 0.4s; z-index: 9999; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- MAINTENANCE OVERLAY -->
<div id="maintenanceScreen" class="hidden fixed inset-0 z-[10000] bg-[#020617] flex flex-col items-center justify-center p-6 text-center overflow-hidden">
  <div class="absolute inset-0 opacity-20 pointer-events-none" style="background: repeating-linear-gradient(0deg, transparent, transparent 2px, #00ff9d 2px, #00ff9d 4px); background-size: 100% 4px;"></div>
  <div class="w-20 h-20 border-4 border-[#00ff9d] border-t-transparent rounded-full animate-spin mb-8 shadow-[0_0_20px_#00ff9d]"></div>
  <h1 class="text-2xl font-black mono text-[#00ff9d] animate-pulse tracking-widest uppercase">Server_Updating...</h1>
  <p class="text-[10px] mono text-[#00ff9d]/40 mt-2 uppercase tracking-[0.4em]">M.6/4_Smart_Hub_Systems</p>
  <div class="glass p-6 rounded-[2.5rem] border border-[#00ff9d]/20 w-full max-w-xs mt-10 space-y-4">
    <div class="flex justify-between text-[10px] mono font-bold text-[#00ff9d]"><span>PROGRESS</span><span id="updatePercent">0%</span></div>
    <div class="w-full h-1.5 bg-[#00ff9d]/10 rounded-full overflow-hidden">
      <div id="updateBar" class="h-full bg-[#00ff9d] transition-all duration-700 shadow-[0_0_10px_#00ff9d]" style="width: 0%"></div>
    </div>
  </div>
  <button onclick="bypassMT()" class="mt-20 opacity-0 hover:opacity-10 text-[8px] mono text-white">ADMIN_BYPASS</button>
</div>

<!-- TOAST -->
<div id="toast" class="glass px-8 py-4 rounded-2xl text-xs font-bold shadow-2xl border border-white/10">⚡ <span id="toastMsg">Success</span></div>

<!-- NAV -->
<nav class="sticky top-0 z-50 glass border-b border-white/5 px-6 py-4 flex justify-between items-center">
  <div class="flex items-center gap-4">
    <div class="w-11 h-11 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white font-bold text-lg shadow-lg">6/4</div>
    <div>
      <h1 class="text-sm font-black tracking-tighter uppercase display">Smart Hub <span class="text-accent">v27.2</span></h1>
      <p id="userDisplayName" class="text-[9px] mono opacity-50 uppercase tracking-widest italic">Guest_Node</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <div id="statusBadge" class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-success/10 text-success text-[9px] font-bold border border-success/20">
      <span class="w-1.5 h-1.5 rounded-full bg-success animate-pulse"></span> ONLINE
    </div>
    <button onclick="toggleDarkMode()" id="themeBtn" class="w-10 h-10 rounded-xl glass flex items-center justify-center hover:bg-white/10 transition-all">🌙</button>
    <button onclick="handleLogout()" class="px-4 py-2 border border-red-500/30 text-red-500 rounded-xl text-[10px] font-black uppercase hover:bg-red-500 hover:text-white transition-all">Exit</button>
  </div>
</nav>

<!-- LOGIN SECTION -->
<div id="loginSection" class="flex-1 flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_rgba(91,94,244,0.05),_transparent)]">
  <div class="glass p-10 rounded-[3.5rem] w-full max-w-sm shadow-2xl animate-slide-up text-center border-white/10">
    <div class="w-20 h-20 bg-accent/10 text-accent rounded-3xl flex items-center justify-center text-4xl mx-auto mb-8 animate-glow">🔐</div>
    <h2 class="text-2xl font-black display tracking-tight mb-8">AUTHENTICATE</h2>
    <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
      <div class="space-y-1">
        <label class="text-[10px] font-black mono opacity-40 ml-2 uppercase">// Student_ID</label>
        <input type="text" id="login-u" placeholder="เลขที่ของคุณ" required class="w-full p-4 rounded-2xl glass border border-white/5 focus:border-accent outline-none text-sm mono transition-all">
      </div>
      <div class="space-y-1">
        <label class="text-[10px] font-black mono opacity-40 ml-2 uppercase">// Access_Key</label>
        <input type="password" id="login-p" placeholder="Password" required class="w-full p-4 rounded-2xl glass border border-white/5 focus:border-accent outline-none text-sm mono transition-all">
      </div>
      <button type="submit" placeholder="login"class="w-full py-4 bg-accent text-white rounded-2xl font-black text-xs tracking-widest shadow-xl shadow-accent/20 uppercase mt-4 hover:opacity-90 transition-all">Initialize_Session</button>
    </form>
    <button onclick="alert('🔑 ลืมรหัสผ่าน?\nกรุณาติดต่อ Admin เพื่อ Reset รหัสผ่านเป็น 1234')" class="mt-6 text-[10px] mono opacity-30 hover:opacity-100 transition-all">[ Forgot_Password? ]</button>
    <p id="loginError" class="text-xs text-red-500 mt-4 hidden font-black"></p>
  </div>
</div>

<!-- MAIN HUB -->
<div id="mainSection" class="hidden flex-1 flex flex-col">
  <div class="max-w-7xl mx-auto w-full px-6 flex gap-8 border-b border-white/5 overflow-x-auto no-scrollbar">
    <button onclick="switchTab('homeworkTab')" id="btn-homeworkTab" class="py-5 text-xs font-black mono tab-active tracking-widest">DASHBOARD</button>
    <button onclick="switchTab('statsTab')" id="btn-statsTab" class="py-5 text-xs font-black mono opacity-40 tracking-widest">ANALYTICS</button>
    <button onclick="switchTab('adminTab')" id="btn-adminTab" class="hidden py-5 text-xs font-black mono text-red-500 opacity-40 tracking-widest">ROOT_CMD</button>
  </div>

  <main class="max-w-7xl w-full mx-auto px-6 py-8 space-y-8 pb-24">
    
    <!-- DASHBOARD -->
    <div id="homeworkTab" class="space-y-8 animate-slide-up">
      <!-- Assistant Controls -->
      <div id="assistantTools" class="hidden glass p-6 rounded-[2.5rem] border-l-4 border-accent space-y-5 bg-gradient-to-r from-accent/5 to-transparent">
        <p class="text-[10px] font-black mono text-accent uppercase tracking-[0.2em]">// Assistant_Tools_Active</p>
        <div class="flex flex-wrap gap-3">
          <button onclick="openAddHwModal()" class="px-6 py-3 bg-accent text-white rounded-xl text-[10px] font-black shadow-lg shadow-accent/30 hover:scale-105 transition-all">+ NEW_TASK</button>
          <button onclick="syncSubjects()" class="px-6 py-3 border border-accent text-accent rounded-xl text-[10px] font-black hover:bg-accent hover:text-black transition-all">🔄 SYNC_TIMETABLE</button>
          <button onclick="exportCSV()" class="px-6 py-3 glass border border-white/10 rounded-xl text-[10px] font-black hover:bg-white/10 transition-all">📥 EXPORT</button>
        </div>
      </div>
      <div id="homeworkContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- STATS -->
    <div id="statsTab" class="hidden animate-slide-up space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 glass p-8 rounded-[3rem] h-[400px] flex flex-col items-center">
          <p class="text-[10px] font-black mono opacity-30 mb-6 uppercase tracking-widest">// Mission_Success_Ratio</p>
          <div class="relative flex-1 w-full"><canvas id="statChart"></canvas></div>
        </div>
        <div class="glass p-8 rounded-[3rem] flex flex-col justify-center text-center space-y-8">
           <div><p class="text-4xl font-black display" id="count-total">0</p><p class="text-[9px] mono opacity-40 uppercase">Total_Tasks</p></div>
           <div class="w-full h-px bg-white/5"></div>
           <div><p class="text-4xl font-black display text-success" id="count-done">0</p><p class="text-[9px] mono opacity-40 uppercase">Completed</p></div>
        </div>
      </div>
    </div>

    <!-- ADMIN ROOT_CMD -->
    <div id="adminTab" class="hidden animate-slide-up space-y-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Control Card -->
        <div class="glass p-8 rounded-[3.5rem] border border-red-500/20 space-y-8">
          <div class="space-y-4">
            <p class="text-[10px] font-black mono text-red-500 uppercase tracking-widest">// Password_Override</p>
            <div class="flex gap-2">
              <input type="text" id="reset-id" placeholder="Student ID" class="flex-1 p-4 rounded-2xl glass border border-white/10 outline-none text-sm mono">
              <button onclick="handleResetPW()" class="px-6 py-4 bg-red-500 text-white rounded-2xl font-black text-xs hover:opacity-90 transition-all">RESET</button>
            </div>
          </div>
          <div class="w-full h-px bg-white/5"></div>
          <div class="space-y-4">
            <p class="text-[10px] font-black mono text-accent uppercase tracking-widest">// Server_Status_Toggle</p>
            <button id="mt-btn" onclick="toggleMT()" class="w-full py-4 border border-accent text-accent rounded-2xl text-xs font-black hover:bg-accent hover:text-black transition-all uppercase tracking-widest">Enable_Maintenance</button>
          </div>
        </div>
        <!-- Logs Card -->
        <div class="glass p-8 rounded-[3.5rem] space-y-4 overflow-hidden flex flex-col">
          <p class="text-[10px] font-black mono text-accent uppercase tracking-widest">// Access_History_Logs</p>
          <div id="logList" class="flex-1 text-[10px] mono space-y-3 overflow-y-auto pr-2 no-scrollbar"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL ADD HW -->
<div id="addHwModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md z-[1000] flex items-center justify-center p-6">
  <div class="glass p-10 rounded-[3.5rem] w-full max-w-md shadow-2xl animate-slide-up border border-white/10">
    <h3 class="font-black mb-8 text-xl display tracking-tighter uppercase">Assign_Mission</h3>
    <div class="space-y-5 text-left">
      <div class="space-y-1">
        <label class="text-[10px] font-black mono opacity-40 ml-2 uppercase">// Subject</label>
        <select id="hw-subject" class="w-full p-4 rounded-2xl glass border border-white/5 outline-none text-sm"></select>
      </div>
      <div class="space-y-1">
        <label class="text-[10px] font-black mono opacity-40 ml-2 uppercase">// Mission_Detail</label>
        <input type="text" id="hw-task" placeholder="การบ้านอะไร..." class="w-full p-4 rounded-2xl glass border border-white/5 outline-none text-sm">
      </div>
      <div class="space-y-1">
        <label class="text-[10px] font-black mono opacity-40 ml-2 uppercase">// Deadline</label>
        <input type="date" id="hw-date" class="w-full p-4 rounded-2xl glass border border-white/5 outline-none text-sm mono">
      </div>
      <div class="flex gap-3 pt-6">
        <button onclick="closeAddHwModal()" class="flex-1 py-4 glass rounded-2xl font-black text-xs uppercase hover:bg-red-500/10 hover:text-red-500 transition-all">Abort</button>
        <button onclick="submitHomework()" class="flex-1 py-4 bg-accent text-white rounded-2xl font-black text-xs uppercase shadow-lg shadow-accent/30 tracking-widest">Commit</button>
      </div>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyBXf4KI5YSeMuE7LCf0yHjbOp8CEiOgyzTStFmfGLPJa43NUvgq-finl3lp-5dslhX/exec";
const API_KEY = "M64_SUPER_SECRET_2026";
let currentUser = "", currentRole = "", homeworks = [], chart = null, isMT = false;

window.onload = checkMT;

async function apiCall(data) {
  try {
    const res = await fetch(WEB_APP_URL, { 
      method:'POST', 
      body:JSON.stringify({ ...data, apiKey:API_KEY, role:currentRole, username:currentUser }) 
    });
    return await res.json();
  } catch(e) {
    showToast("Server connection error!", "var(--danger)");
    return { success: false };
  }
}

async function checkMT() {
  const res = await apiCall({ action:'getSystemStatus' });
  if (res.success) {
    isMT = res.maintenance;
    if (isMT) {
      document.getElementById('maintenanceScreen').classList.remove('hidden');
      let p = 0;
      const itv = setInterval(() => {
        p += Math.floor(Math.random() * 5);
        if(p > 99) p = 99;
        document.getElementById('updatePercent').innerText = p + '%';
        document.getElementById('updateBar').style.width = p + '%';
      }, 700);
    }
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('login-u').value.trim();
  const p = document.getElementById('login-p').value.trim();
  const res = await apiCall({ action:'login', username:u, password:p });

  if (res.success) {
    currentUser = u; currentRole = res.role;
    if (res.isFirstTime) {
      const np = prompt("SECURITY_WARNING: รหัสผ่านเริ่มต้นไม่ปลอดภัย\nกรุณาตั้งรหัสใหม่ (8 ตัวอักษรขึ้นไป):");
      if (np && np.length >= 8) await apiCall({ action:'setFirstPassword', username:u, newPassword:np });
      else return alert("ต้องเปลี่ยนรหัสก่อน!");
    }
    loginSuccess();
  } else {
    showToast(res.message, "var(--danger)");
    document.getElementById('loginSection').classList.add('animate-shake');
    setTimeout(() => document.getElementById('loginSection').classList.remove('animate-shake'), 500);
  }
}

function loginSuccess() {
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('mainSection').classList.remove('hidden');
  document.getElementById('statusBadge').classList.remove('hidden');
  document.getElementById('userDisplayName').innerText = `USER_${currentUser} | ROLE_${currentRole.toUpperCase()}`;
  if (currentRole === 'admin') {
    document.getElementById('btn-adminTab').classList.remove('hidden');
    document.getElementById('mt-btn').innerText = isMT ? "DISABLE_MAINTENANCE" : "ENABLE_MAINTENANCE";
  }
  if (currentRole === 'admin' || currentRole === 'assistant') document.getElementById('assistantTools').classList.remove('hidden');
  loadHomework(); loadSubjects();
  showToast(`⚡ Welcome, Node ${currentUser}`, "var(--accent)");
}

async function loadHomework() {
  const res = await apiCall({ action:'getHomework' });
  if (res.success) {
    homeworks = res.data;
    renderHomework();
  }
}

function renderHomework() {
  const cont = document.getElementById('homeworkContainer');
  const manage = (currentRole === 'admin' || currentRole === 'assistant');
  cont.innerHTML = homeworks.map(h => {
    const isD = h.status === 'done';
    return `
      <div class="glass p-7 rounded-[3rem] fade-in flex flex-col justify-between border-l-4 ${isD?'opacity-40 border-success shadow-none':'border-accent shadow-lg'}">
        <div>
          <div class="flex justify-between items-start mb-5">
            <span class="text-[9px] font-black mono bg-accent/10 text-accent px-2.5 py-1 rounded-lg uppercase tracking-widest">${h.subject}</span>
            ${manage ? `<button onclick="deleteHW('${h.id}')" class="text-red-500 font-bold text-xs hover:scale-150 transition-all">🗑</button>` : ''}
          </div>
          <h3 class="font-bold text-sm leading-relaxed mb-2">${h.task}</h3>
        </div>
        <div class="mt-6 pt-4 border-t border-white/5 flex justify-between items-center">
          <div class="flex flex-col">
            <span class="text-[8px] mono opacity-30 uppercase tracking-tighter">Deadline</span>
            <span class="text-[10px] mono font-bold">${h.dueDate||'NO_DATE'}</span>
          </div>
          <button onclick="toggleHW('${h.id}','${h.status}')" class="px-6 py-3 rounded-2xl text-[9px] font-black display tracking-widest ${isD?'glass border border-white/10':'bg-accent text-white shadow-lg shadow-accent/20'}">
            ${isD ? 'REVERT' : 'DONE'}
          </button>
        </div>
      </div>
    `;
  }).join('');
  if(!document.getElementById('statsTab').classList.contains('hidden')) renderChart();
  document.getElementById('count-total').innerText = homeworks.length;
  document.getElementById('count-done').innerText = homeworks.filter(h=>h.status==='done').length;
}

async function toggleHW(id, cur) {
  const next = cur === 'done' ? 'pending' : 'done';
  const res = await apiCall({ action:'updateStatus', id, status:next });
  if (res.success) {
    if (next === 'done') confetti({ particleCount:150, spread:70, origin:{y:0.7}, colors:['#5b5ef4', '#10b981'] });
    loadHomework();
  }
}

// --- ADMIN / ASSISTANT ---
async function syncSubjects() {
  if (confirm("ต้องการอัปเดตวิชาเรียน 16 วิชาหลักตามตารางเรียน?")) {
    const res = await apiCall({ action:'syncSubjects' });
    if(res.success) { showToast("✓ Database Synced", "var(--success)"); loadSubjects(); }
  }
}

async function handleResetPW() {
  const id = document.getElementById('reset-id').value;
  if (!id || !confirm(`ยืนยันการรีเซ็ตรหัสของ ${id} เป็น 1234?`)) return;
  const res = await apiCall({ action:'adminResetPassword', targetUsername:id });
  if (res.success) { showToast(`✓ Reset Successful`, "var(--success)"); document.getElementById('reset-id').value = ''; loadLogs(); }
}

async function toggleMT() {
  const next = !isMT;
  const res = await apiCall({ action:'toggleMaintenance', status:next });
  if (res.success) { isMT = next; location.reload(); }
}

async function loadLogs() {
  const res = await apiCall({ action:'getUsageLogs' });
  if (res.success) {
    document.getElementById('logList').innerHTML = res.data.map(l => `
      <div class="pb-3 border-b border-white/5 flex flex-col gap-1">
        <div class="flex justify-between items-center text-[8px]">
          <span class="text-accent font-black uppercase tracking-widest">${l[1]}</span>
          <span class="opacity-20 mono">${new Date(l[0]).toLocaleString()}</span>
        </div>
        <span class="opacity-70 text-[9px] italic">${l[2]}: ${l[3]}</span>
      </div>`).join('');
  }
}

// --- CORE UI ---
function switchTab(id) {
  ['homeworkTab','statsTab','adminTab'].forEach(t => document.getElementById(t).classList.add('hidden'));
  ['btn-homeworkTab','btn-statsTab','btn-adminTab'].forEach(b => document.getElementById(b).classList.remove('tab-active', 'opacity-100'));
  document.getElementById(id).classList.remove('hidden');
  document.getElementById('btn-'+id).classList.add('tab-active', 'opacity-100');
  if (id === 'adminTab') loadLogs();
  if (id === 'statsTab') setTimeout(renderChart, 200);
}

function showToast(m, c) { 
  const t = document.getElementById('toast'); 
  document.getElementById('toastMsg').innerText = m; 
  if(c) t.style.borderColor = c;
  t.classList.add('show'); 
  setTimeout(()=>t.classList.remove('show'), 3000); 
}

function toggleDarkMode() { 
  const html = document.documentElement;
  const btn = document.getElementById('themeBtn');
  if (html.classList.contains('dark')) {
    html.classList.replace('dark','light'); btn.innerText='🌙';
  } else {
    html.classList.replace('light','dark'); btn.innerText='☀️';
  }
  if(!document.getElementById('statsTab').classList.contains('hidden')) renderChart();
}

function bypassMT() { const k = prompt("ADMIN_KEY:"); if(k==="M64") document.getElementById('maintenanceScreen').classList.add('hidden'); }
function openAddHwModal() { document.getElementById('addHwModal').classList.remove('hidden'); }
function closeAddHwModal() { document.getElementById('addHwModal').classList.add('hidden'); }
function handleLogout() { location.reload(); }
async function loadSubjects() { const res = await apiCall({ action:'getSubjects' }); if (res.success) document.getElementById('hw-subject').innerHTML = res.data.map(s=>`<option value="${s}">${s}</option>`).join(''); }
async function submitHomework() { 
  const t = document.getElementById('hw-task').value;
  if(!t) return showToast("กรุณากรอกรายละเอียด", "var(--danger)");
  await apiCall({ action:'addHomework', subject:document.getElementById('hw-subject').value, task:t, dueDate:document.getElementById('hw-date').value }); 
  closeAddHwModal(); loadHomework(); showToast("✓ Mission Logged", "var(--success)");
}
async function deleteHW(id) { if (confirm("ยืนยันการลบภารกิจนี้?")) { await apiCall({ action:'adminDeleteHomework', id }); loadHomework(); } }

function renderChart() {
  const done = homeworks.filter(h=>h.status==='done').length;
  const pending = homeworks.length - done;
  const ctx = document.getElementById('statChart').getContext('2d');
  const isDark = document.documentElement.classList.contains('dark');
  if (chart) chart.destroy();
  chart = new Chart(ctx, { 
    type:'doughnut', 
    data:{ 
        labels:['COMPLETED','PENDING'], 
        datasets:[{ data:[done,pending], backgroundColor:[isDark?'#00ff9d':'#10b981','#6366f1'], borderWidth:0, hoverOffset: 15 }] 
    }, 
    options:{ 
        maintainAspectRatio:false, 
        cutout:'80%', 
        plugins:{ legend:{ position:'bottom', labels:{ color:isDark?'#94a3b8':'#18163a', font:{ family:'JetBrains Mono', size:10 } } } } 
    } 
  });
}

function exportCSV() {
  const csv = "ID,Subject,Task,Deadline,Status\n" + homeworks.map(h => `${h.id},${h.subject},${h.task},${h.dueDate},${h.status}`).join("\n");
  const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv); a.download = 'M64_HUB_DATA.csv'; a.click();
}
</script>
